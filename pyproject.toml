[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shortly-url-shortener"
version = "2.0.0"
description = "Production-minded URL management platform"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20,<1", "alembic>=1.14,<2", "asyncpg>=0.30,<1",
  "email-validator>=2.2,<3", "fastapi>=0.116,<1", "greenlet>=3.1,<4", "httpx>=0.28,<1",
  "pwdlib[argon2]>=0.3,<1", "pydantic-settings>=2.7,<3", "PyJWT>=2.10,<3",
  "psycopg[binary]>=3.2,<4", "python-multipart>=0.0.20,<1", "qrcode[pil]>=8,<9", "redis>=5,<7",
  "sqlalchemy>=2.0.36,<3", "ua-parser>=1,<2", "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["asgi-lifespan>=2.1,<3", "pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

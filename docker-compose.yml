services:
  db:
    image: postgres:17-alpine
    environment: {POSTGRES_DB: shortly, POSTGRES_USER: shortly, POSTGRES_PASSWORD: shortly_dev}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, pg_isready -U shortly], interval: 5s, timeout: 5s, retries: 10}
  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1
    healthcheck: {test: [CMD, redis-cli, ping], interval: 5s, timeout: 3s, retries: 10}
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://shortly:shortly_dev@db:5432/shortly
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in your shell or .env}
      ANALYTICS_SALT: ${ANALYTICS_SALT:?Set ANALYTICS_SALT in your shell or .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}}
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]
volumes: {postgres_data: {}}

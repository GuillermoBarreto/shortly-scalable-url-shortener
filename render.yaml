services:
  - type: web
    name: shortly-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - {key: DATABASE_URL, fromDatabase: {name: shortly-db, property: connectionString}}
      - {key: SECRET_KEY, generateValue: true}
      - {key: ANALYTICS_SALT, generateValue: true}
      - {key: PUBLIC_BASE_URL, sync: false}
      - {key: CORS_ORIGINS, sync: false}
databases:
  - name: shortly-db
    databaseName: shortly
    user: shortly
